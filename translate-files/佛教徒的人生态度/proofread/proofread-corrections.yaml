- title: 人生佛教译法应为 Buddhism for Human Life
  location: PDF 第 177 页（内页码 173）/ 第 178 页（内页码 174），Section IV, chapter 3
  original: Master Taixu (1890–1947) advocated “Buddhism of Human Life,” ... / “Buddhism
