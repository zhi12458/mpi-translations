  zh: 看见并感恩生活中的点滴美好
  en: Seeing and appreciating the small beauties in life
- slide: 15
  shape: 2
  run: 0
  kind: title
  zh: 现场练习：感恩日记
  en: 'In-Class Exercise: Gratitude Journal'
- slide: 15
  shape: 4
  run: 0
  kind: body
  zh: 仔细观察生活中值得感恩的人、事、物，用手机或纸笔写下来，多多益善。并评估自己对每一项的“感恩程度”（1-5分，5分代表非常感恩）。
  en: Carefully observe the people, events, and things in your life worth feeling
    grateful for. Write them down on your phone or on paper — the more, the better.
    Then rate your "level of gratitude" for each item (1-5, with 5 meaning very grateful).
- slide: 15
  shape: 4
  run: 1
  kind: body
  zh: 1、_____________________________
  en: 1. _____________________________
- slide: 15
  shape: 4
  run: 2
  kind: body
  zh: 2、_____________________________
  en: 2. _____________________________
- slide: 15
  shape: 4
  run: 3
  kind: body
  zh: 3、_____________________________
  en: 3. _____________________________
- slide: 15
  shape: 4
  run: 4
  kind: body
  zh: ······
  en: ······
- slide: 15
