  en: Self-Reflection
- slide: 26
  shape: 5
  run: 0
  kind: body
  zh: 建立在生活中的不同场景中有意识的带着感恩心面对当下的人和事的习惯。
  en: Build the habit of consciously facing present-moment people and events with
    gratitude across different life situations.
- slide: 26
  shape: 8
  run: 0
  kind: body
  zh: 建立留意生活中的善意、好事（哪怕很微小）的习惯。
  en: Build the habit of noticing kindness and good things in life (no matter how
    small).
- slide: 26
  shape: 11
  run: 0
  kind: body
  zh: 建立一种普遍的感恩心，广泛的联结感，感受到自我生活于众多的因缘之中，弱化自我中心和孤立隔阂。
  en: Build a universal sense of gratitude and a broad sense of connectedness, feeling
    that we live within a vast web of causality, thereby weakening self-centeredness
    and the sense of isolation.
