  zh: 定义：
  en: 'Definition:'
- slide: 4
  shape: 2
  run: 1
  kind: body
  zh: 对拥有的一切心怀感恩，
  en: Be grateful for everything you have,
- slide: 4
  shape: 2
  run: 2
  kind: body
  zh: 感激所有付出的人。
  en: and appreciate all those who have contributed.
- slide: 4
  shape: 2
  run: 4
  kind: body
  zh: 佛教所说的感恩，不仅仅局限于某个具体的人或事。佛教认为，一切众生是相互依赖的，每个人的生存都离不开家庭、社会、大众、自然，所以要心怀感恩地面对一切。
  en: In Buddhism, gratitude is not limited to specific people or events. Buddhism
    teaches that all sentient beings are interdependent; no one can survive without
    family, society, all people, and nature. Therefore, we should face everything
    with a grateful heart.
