    to be something that can be eliminated by the practitioners of the two vehicles 二乘, being less subtle than the attachment to dharmas 法執 (Skt. ahaṃ-kāra, ātma-grāha, ahaṃkāra-manaskāratā, ahaṃ-kṛti,
    ātma-dṛṣṭi, ātma-sneha, ātmâbhiniveśa, ātmêti, ātmôpalambha, sāhaṃkāra-manaskāratā; Tib. nga rgyal, bdag tu ''dzin pa). 〔瑜伽論 T 1579.30.307c26, 成唯識論 T 1585.31.2a9〕 [Charles Muller; source(s): Nakamura,
    Stephen Hodge, JEBD,Yokoi]

