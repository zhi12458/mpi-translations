- 中文: 阿赖耶识
  英文: the Alaya Consciousness.
  释义: The notion of the store consciousness arose out of early problems surrounding the continuity of both karmic potential and the afflictions (kleśa; nyon mongs) in a latent state (anuśaya; bag la nyal
    ba) that had been generated by the Abhidharma emphasis upon momentary processes of mind. How, after all, could these two essential components of saṃsāric existence, which are eliminated only toward
    the end of the path, continuously persist if oneʼs mental stream (saṃtāna; rgyud) were comprised solely of whatever dharmas (chos) were momentarily present and manifest in mind.The ālayavijñāna thus
    came to denote the mental processes that underlie each and every moment of the traditional six forms of manifest cognitive awareness (pravṛtti-vijñāna; 'jug pa'i rnam par shes pa)—a term coined to distinguish
    it from the continuous yet subliminal ālaya or 'home' awareness.
  出处: DDB
