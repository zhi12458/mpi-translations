  释义: 'Or scruple. One of the ten wholesome mental factors detailed in the Abhidharmakośabhāṣya 大善地法, one of the eleven wholesome mental factors 十一善 in Yogâcāra; the mental function of having the sense
    to reflect on whether oneʼs actions will cause harm. Often seen used in the compound 慚愧 where 慚 means conscience—reflection within oneself, and 愧 means shame in the face of other people (Skt. vyapatrāpya,
    apatrāpya, apatrapā; apatrapaṇatā, apatrāpa, otrāpya, lajjin, vyavatrāpya, hrī; Tib. khrel yod pa). '
