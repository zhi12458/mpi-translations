  释义: 'Absence of self, non-self. The lack of existence of an inherent self, soul, or self, from the standpoint of Buddhist analysis. The empirical self is merely an aggregation of various elements, and
    with their disintegration it ceases to exist; therefore it has no ultimate reality of its own. This is one of the most important philosophical concepts in all of Buddhism, and is understood as having
