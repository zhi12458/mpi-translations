  释义: 'Conscience, or self-motivated shame for oneʼs wrongdoings (Skt. hrī). In the Abhidharmakośa-bhāṣya, one of the ten virtuous mental factors 大善地法, and in Yogâcāra, one of the eleven wholesome mental
    factors 十一善. It refers to sense of conscience that brings one to reflect on oneʼs self-centered evil actions. According to the Abhidharmakośa-bhāṣya, the difference between conscience and shame (apatrāpa
    愧) is that the dominant factor in conscience is oneʼs own sense of moral scruple 自增上, while the dominant factor in producing shame is oneʼs embarrassment 恥 in the face of others 他增上 (Skt. trapā, apatrāpya,
    hirimat, hiri, hrīmat; Tib. ngo tsha shes pa). '
  出处: DDB
- 中文: 愧
