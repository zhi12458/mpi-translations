- 中文: 空
  英文: Emptiness
  释义: 'The Sanskrit word is Sunya. One of the key concepts in Buddhism. Emptiness is an abstract idea representing impermanence, unreality, instability, transience and relativity in the nature of all existence.
    The doctrine states that all phenomena and the ego have no reality, but are composed of a certain number of Skandhas or elements, which disintegrate. The doctrine also states that everything is unstable,
    possessing no self-essence or self-nature, i.e., its own existence dependent or caused by the conditions of others'' existence.

    Emptiness is not nothing, but it is the condition of existence of everything. It permeates all phenomena making possible their evolution.'
  梵文: Sunya
  出处: fodict
- 中文: 我执
