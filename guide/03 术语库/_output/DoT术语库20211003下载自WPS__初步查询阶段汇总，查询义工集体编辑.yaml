  英文: five desires
  释义: '1) Five kinds of desire that arise from attachment to the objects of eyes, ears, nose, tongue, and body. The desires of regular people. Also a reference to the five objects themselves in the sense
    that they are the cause of these desires: form, sound, fragrance, flavor, and tactility.

    2) The five desires of wealth, sex, food, fame, and sleep.'
  出处: DDB
- 中文: 华严
  英文: Huayan
  释义: The Huayan (or Flower Garland) school of Buddhism is a tradition of Mahayana Buddhist philosophy that first flourished in China during the Tang dynasty. The Huayan worldview is based primarily on
    the Avatamsaka Sutra. The name Flower Garland is meant to suggest the crowning glory of a Buddha's profound understanding of ultimate reality. The Huayan School is known as Hwaeom in Korea, Kegon in
    Japan and Hoa Nghiêm in Vietnam. This tradition also had a strong influence on Chan Buddhism.
  出处: Wikipedia
- 中文: 净宗
  英文: Pure Land school
  释义: A broad branch of Mahayana Buddhism and one of the most widely practiced traditions of Buddhism in East Asia. Pure Land is a tradition of Buddhist teachings that are focused on the Buddha Amitābha.
    The three primary texts of the tradition, known as the "Three Pure Land Sutras", are the Longer Sukhāvatīvyūha Sūtra, Amitayurdhyana Sutra and the Shorter Sukhāvatīvyūha Sūtra. Pure Land oriented practices
    and concepts are found within basic Mahāyāna Buddhist cosmology, and form an important component of the Mahāyāna Buddhist traditions of China, Japan, Korea, Tibet and Vietnam.Pure Land Buddhism is built
    on the belief that there will never be a world which is not corrupt, so the rebirth in another plane, referred to as the "Pure Land" is the goal.
  出处: Wikipedia
- 中文: 念佛
  英文: remembrance of the Buddhaʼs name
  释义: 'To be mindful of the meritorious virtues of the Buddha. Most well known as a practice of the Pure Land school, which entails the verbal chanting of the name of Amitâbha Buddha for the purpose of
    obtaining rebirth in the Pure Land. Repetition is done both audibly and inaudibly. It is one of the thirty-eight meditation subjects and the ten recollections. '
  出处: DDB
- 中文: 轮回
  英文: samsara
  释义: This is the expression of the ancient Indian idea that all living things repeatedly pass through life and death. Like a continually spinning wheel, sentient beings are reincarnated and die without
    end. In Buddhism, one is said to transmigrate through the triple realm (desire, form and formless realms) and the six destinies (god, demigod, human, animal, hungry ghost, hell-being).
  梵文: saṃsāra
  出处: DDB
- 中文: 六尘
  英文: six objects
  释义: The six fields of the senses, i. e. the objective fields of sight, hearing, smelling, tasting, touching, and thought.
  出处: DDB
- 中文: 天台
  英文: Tiantai
  释义: An East Asian Buddhist school of Mahayana that developed in sixth century China. The school emphasizes the Lotus Sutra's doctrine of the "One Vehicle" as well as Madhyamaka philosophy, particularly
    as articulated in the works of the fourth patriarch Zhiyi (538–597 CE). The name of the school is derived from the fact that Zhiyi lived on Tiantai Mountain, which then became a major center for the
    tradition. Tiantai is sometimes also called "The Lotus School", after the central role of the Lotus Sutra in its teachings. According to Paul Swanson, Tiantai Buddhism grew to become "one of the most
    influential Buddhist traditions in China and Japan."
  出处: Wikipedia
- 中文: 三藏
  英文: Tripitaka
  释义: 'The Buddhist canon, traditionally categorized into three divisions. These are the sūtra-piṭaka (sermons collection), vinaya-piṭaka (rules collection), and the abhidharma-piṭaka (philosophical treatises
    collection). '
  梵文: tripiṭaka
  巴利文: tipiṭaka
  出处: DDB
- 中文: 三宝
  英文: Triple Gem
  释义: The basic set of three are (1) the Buddha; (2) the Dharma (Buddhist teachings), and (3) the Sangha (community of monks and nuns).
  出处: DDB
- 中文: 十二部
  英文: Twelve Divisions of Sutras
  释义: 'The sutras divided according to genre, including: 1) sūtra, the Buddhaʼs discourses; 2) geya, verses; 3) gāthā, verse part of a discourse; 4) nidāna, historical narratives; 5) itivṛttaka, activities
    of Buddha or his disciples in past lives; 6) jātaka, Buddhaʼs past life stories; 7) adbhuta-dharma, Buddhaʼs miraculous acts; 8) avadāna, legends; 9) upadeśa, didactic lessons; 10) udāna, teachings
    offered by the Buddha without prompting; 11) vaipulya, expanded teachings; 12) vyākaraṇa, guarantees of future attainment.'
  出处: DDB
- 中文: '极乐 '
  英文: ultimate bliss
  释义: It's the  highest joy (Skt. sukha). Also Sukhāvatī, the name of the Pure Land of Amitâbha Buddha.
  出处: DDB
