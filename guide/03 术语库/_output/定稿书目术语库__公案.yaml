- 中文: 六祖门下的南岳怀让也对一味枯坐不以为然。马祖道一在南岳坐禅，怀让禅师知道他是法器，便前去相问：“大德坐禅图什么？”道一说：“图作佛。”怀让就拿砖在他面前磨，道一诧异：“磨作什么？”怀让说：“磨作镜。”道一不解：“磨砖岂能成镜？”怀让说：“磨砖不能作镜，坐禅又岂能成佛？”道一又问：“那应该怎么办？”怀让说：“如牛驾车，假如车不驶，应该打车还是打牛？同样，你希望通过坐禅成佛，可是禅非坐卧，佛无定相，于无住法，不应取舍。如果执于坐相，不仅不能通达禅，且永远都不能成佛。”
  英文: "Master Huairang, a disciple of the Sixth Patriarch in Nanyue, did not favor the idea of simply sitting for meditation, either. When Mazu Daoyi was sitting in meditation in Nanyue, Master Huairang,\
    \ believing he was a vessel of the Dharma, approached him to inquire: \n“What do you seek by sitting in meditation, master?”\n“To become a Buddha,” replied Daoyi. \nThen, Master Huairang picked up a\
    \ brick and began grinding it on a stone. \nDaoyi was confused, “What are you doing?”\n“I am grinding the brick to make a mirror.” replied Huairang. \nDaoyi became puzzled, “How can you make a mirror\
    \ by grinding a brick?” \nHuairang said, “If a mirror cannot be made by grinding a brick, how can one become a Buddha by sitting in meditation?” \nDaoyi felt even more puzzled, asking, “What should\
    \ I do then?” \nHuairang explained, “It is like a bull pulling a cart. If the cart does not move, should you whip the cart or the bull? Similarly, you hope to become a Buddha by sitting in meditation,\
    \ but Chan is not confined to sitting or lying down, and Buddha has no fixed forms. In the principle of non-abidance, one should not cling nor reject. If you cling to the form of sitting, not only will\
    \ you not understand Chan, but you will also never achieve Buddhahood.”"
  摘自: 生命的痛苦及其解脱
- 中文: 六祖接引怀让禅师时，怀让礼祖，六祖问：“何处来？”怀让曰：“嵩山。”祖问：“什么物，恁么来？”怀让曰：“说似一物即不中。”六祖问：“还可修证否？”怀让曰：“修证即不无，染污即不得。”六祖说：“就是这个不染污的东西，诸佛之所护念。汝即如是，我也如是。”
  英文: "When the Sixth Patriarch decided to guide Huairang, Huairang bowed to pay homage. Then the Patriarch asked, “Where do you come from?”\nHe replied, “From Mount Song.”\nThe Patriarch asked, “What thing\
    \ is it, and how does it come?” \nHe replied, “To say that it is like a thing is to miss the point.”\nThe Patriarch said, “Then, can it still be cultivated and realized?” \nHe replied, “The practice\
    \ is to attain emptiness. But it is unattainable when tainted.” \nThe Patriarch said, “It is precisely this untainted thing that is guarded by all Buddhas. You are like this, and I am like this, too.”"
  摘自: 生命的痛苦及其解脱
- 中文: 赵州游天台，路遇寒山，见道边有牛脚印，寒山说：“你看到牛了吗？”赵州说：“不识。”寒山指着牛脚迹说：“这是五百罗汉游山留下的。”赵州说：“既然是罗汉，怎会留下牛脚迹呢？”寒山说：“苍天苍天。”赵州呵呵大笑，寒山问：“你笑什么？”赵州说：“苍天苍天。”
  英文: "One day, when Zhaozhou was traveling in Tiantai, he came across Hanshan. Seeing a cow’s hoof prints, Hanshan said, “Did you see the cow?” \nZhaozhou replied, “No, I didn’t.”\nPointing at the hoof\
    \ prints, Hanshan said, “These are the footprints left by five hundred arhats wandering the mountain.”\nZhaozhou asked, “If they are arhats, why would they leave cow hoof prints?”\nHanshan said, “Vast\
    \ sky, vast sky.” \nZhaozhou burst into laughter. \nHanshan asked, “What are you laughing at?”\nZhaozhou replied, “Vast sky, vast sky.”"
  摘自: 生命的痛苦及其解脱
- 中文: 慧休禅师三十年着一双鞋；大梅法常禅师不吃锄下之菜；左溪玄朗常行头陀，居住石岩间，一件袈裟穿了四十多年；通慧禅师入太白山，不带粮草，居于树下，饿食树果，渴饮泉水，布衲终身不换；智则禅师性格不羁，屋内除了床单、瓦钵、木匙外一无所有，房门从不关闭……
  英文: Chan master Huixiu wore the same pair of shoes for thirty years; Chan master Fachang in Damei did not eat vegetables cultivated from plowing; Chan master Xuanlang in Zuoxi always lived an ascetic
    life, sheltering himself under rocks and cladding in the same robe for over forty years; Chan master Tong-hui entered Mount Taibai without carrying provisions, lived under a tree, ate wild fruits when
    hungry, drank from springs when thirsty, and never changed his patched robe for life; Chan master Zhize, with an unrestrained personality, had nothing in his house except a bedsheet, a bowl, and a wooden
    spoon, and never closed his door.
  摘自: 生命的痛苦及其解脱
- 中文: 大珠慧海禅师参拜马祖。祖问：“来这里干什么？”慧海禅师曰：“来求佛法。”祖曰：“我这里一物也无，求什么佛法？自家宝藏抛弃不顾，到处乱跑做什么？”慧海禅师问：“哪个是我的宝藏呢？”祖曰：“现在问我的就是你的宝藏，一切具足，更无欠少，使用自在，为什么还要到外面去求呢？”慧海禅师在马祖的开示下，当下认识到自己。后来有人问慧海禅师：“如何是佛？”他回答说：“清潭对面，非佛而谁？”又如灵训禅师参归宗，灵训问：“如何是佛？”归宗禅师说：“我告诉你，恐怕不相信。”灵训说：“大和尚的开示，我岂敢不信？”归宗禅师说：“你就是。”如何是佛？其实就是每个人真正的生命，就是我们的佛性。
  英文: "When Chan master Huihai of Dazhu visited Mazu Daoyi, Daoyi asked, “Why are you coming here?”\nHuihai replied, “To seek the Dharma.”\nDaoyi said, “What Dharma? I have nothing here. Why abandon your\
    \ own treasure and seek elsewhere?”\nHuihai was puzzled, “What is my treasure?” \nDaoyi replied, “The one who is asking me is your treasure. It is endued with everything, rather than devoid of anything.\
    \ It can be used freely as you want. Why do you seek it elsewhere?”\nIlluminated by Daoyi, Huihai realized his true self at that very moment. \nLater, someone asked Huihai, “What is a Buddha?” \nHe\
    \ replied, “If you’re not a Buddha, then who is?”\nHere is another example. One day, Chan Master Lingxun called on Chan Master Guizong. He asked, “What is a Buddha?”\nGuizong said, “I’m afraid you won’t\
    \ believe it if I tell you about it.”\nLingxun asked, “How dare I doubt a great master’s teaching?”\nGuizong said, “You are a Buddha.”"
  摘自: 生命的痛苦及其解脱
- 中文: 临济禅师上堂开示道：“赤肉团上有一无位真人，常从汝等面门出入，未证者看看。”时有僧相问：“如何是无位真人？”师下禅床一把抓住他说：“道，道！”这位僧人想了一下，师便放开手说：“无位真人是甚么干屎橛。
  英文: "Chan master Linji, elucidated the teachings in the Dharma hall, “In your fleshly mass resides a true person of no position, constantly coming in and out through the gates of your face. Those who\
    \ have not yet become enlightened, see it.” \nA monk asked, “What is the true person of no position?” \nThe Master grabbed him and said, “Speak, speak!” \nAfter the monk pondered for a moment, the Master\
    \ let him go and remarked, “What kind of dry shit-stick is the true person of no position?”"
  摘自: 生命的痛苦及其解脱
- 中文: 六祖接引惠明的公案。六祖从五祖处得了衣钵后一路南行，惠明从后面追上。六祖将衣钵放在石上，惠明拿不动，于是说：“我为法来，不为衣来。”六祖说：“汝既为法来，可放下万缘，不要有任何念头。”又说：“不思善，不思恶，正与么时，哪个是明上座本来面目？”惠明当下认识到自己。
  英文: "Similarly, there is the case of Huiming’s encounter with the Sixth Patriarch. \nAfter receiving the robe and bowl from the Fifth Patriarch, the Sixth Patriarch fled southward, with Huiming in pursuit.\
    \ The Sixth Patriarch placed the robe and bowl on a rock, which Huiming couldn’t lift, prompting him to declare, “I came for the Dharma, not the robe.” \nThe Sixth Patriarch responded, “If you’ve come\
    \ for the Dharma, let go of everything and don’t let a single thought arise.”\nHe further asked, “Without thinking of good or evil, at this very moment, what is your original face?” \nHuiming then recognized\
    \ his true self. "
  摘自: 生命的痛苦及其解脱
- 中文: 六祖在五祖门下悟道时说：“一切万法，不离自性。何期自性，本自清净；何期自性，本不生灭；何期自性，本自具足；何期自性，本无动摇；何期自性，能生万法。”五祖知六祖已经悟到本性，继续为他开示说：“不识本心，学佛法是没有什么利益的。如果认识到本心，就会成为大丈夫、天人师、佛。”
  英文: When the Sixth Patriarch attained enlightenment under the Fifth Patriarch, he declared, “All dharmas do not depart from the self-nature. No matter when, the self-nature is originally pure. No matter
    when, the self-nature is originally unborn and undying. No matter when, the self-nature is originally complete. No matter when, the self-nature is originally immovable. No matter when, the self-nature
    can give rise to all dharmas.” The Fifth Patriarch, recognizing that the Sixth Patriarch had realized his true nature, further explained to him, “Without recognizing one’s own mind, studying the Buddha’s
    teachings is of no benefit. If one realizes the original mind, one will become a great being, a teacher of humans and heavenly beings, a Buddha.”
  摘自: 生命的痛苦及其解脱
