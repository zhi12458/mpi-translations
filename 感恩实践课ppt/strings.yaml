- slide: 8
  shape: 2
  run: 0
  kind: title
  zh: 为什么要修感恩心（利益思维）
  en: ''
- slide: 8
  shape: 4
  run: 0
  kind: body
  zh: 感恩研究领域的领军人物罗伯特·埃蒙斯的观点（Robert Emmons &Mishra, 2012）​，实践感恩可以带来8种不同的好处，包括：
  en: ''
- slide: 8
  shape: 4
  run: 1
  kind: body
  zh: 最佳收益：感恩能让我们从积极的经历中获得最佳收益。
  en: ''
- slide: 8
  shape: 4
  run: 2
  kind: body
  zh: 自我价值和自尊：感恩能提升我们的自我价值和自尊。使我们更加自信和高效。避免自怜，这是一种倾向于感觉受害的状态。
  en: ''
- slide: 8
  shape: 4
  run: 3
  kind: body
  zh: 应对压力：感恩可以帮助我们应对压力和逆境。在最初的震惊之后，感恩可以帮助我们评估什么是生活中最重要的。
  en: ''
- slide: 8
  shape: 4
  run: 4
  kind: body
  zh: 帮助他人：感恩的人更有可能帮助他人。他们变得更能意识到善良和关心的行为，并感到有必要回报。他们不太可能是拜金者，而更可能珍惜他们所拥有的。
  en: ''
- slide: 9
  shape: 2
  run: 0
  kind: title
  zh: 为什么要修感恩心（利益思维）
  en: ''
- slide: 9
  shape: 4
  run: 0
  kind: body
  zh: 更好的人际关系：感恩可以加强我们的人际关系。当我们真正意识到朋友和家人的价值时，我们可能会更好地对待他们。当我们善待他们，他们也善待我们。
  en: ''
- slide: 9
  shape: 4
  run: 1
  kind: body
  zh: 更少的负面比较：表达感激会降低我们与他人比较的可能性。我们变得感恩，满足于我们所拥有的（朋友、家人、家庭、健康）​，并且不太可能为我们没有的东西感到难过。
  en: ''
- slide: 9
  shape: 4
  run: 2
  kind: body
  zh: 更少的负面情绪：当我们表达感激之情时，我们的负面情绪可能会更少。例如，当我们心存感激时，我们就不太可能感到内疚、贪婪或愤怒。
  en: ''
- slide: 9
  shape: 4
  run: 3
  kind: body
  zh: 慢适应：拥有新东西的快乐能持续多久？最初，我们感到快乐，但这种快乐不会持续很长时间。通过欣赏事物和经历的意义和价值，我们可以放慢这种适应的速度，让快乐的体验持续更长的时间。
  en: ''
- slide: 10
  shape: 2
  run: 0
  kind: title
  zh: 为什么要修感恩心（利益思维）
  en: ''
- slide: 10
  shape: 4
  run: 0
  kind: body
  zh: 现代心理学实证研究发现，长期持续修习感恩，可以：
  en: ''
- slide: 10
  shape: 4
  run: 1
  kind: body
  zh: 显著降低焦虑和抑郁水平，提升幸福感
  en: ''
- slide: 10
  shape: 4
  run: 2
  kind: body
  zh: ​增强生理健康与免疫功能​；降低炎症；改善心脏健康。
  en: ''
- slide: 10
  shape: 4
  run: 3
  kind: body
  zh: 感恩可以改善人际关系，使职场合作效率提升55%，家庭感恩表达使冲突率降低37%
  en: ''
- slide: 10
  shape: 4
  run: 4
  kind: body
  zh: 能更快更好地达成目标：高感恩水平学生学业目标达成率提高42%，工作场所创新提案量增加55%
  en: ''
- slide: 10
  shape: 4
  run: 5
  kind: body
  zh: ​改善睡眠质量​，使入睡时间缩短19分钟，深睡眠时长增加17%。
  en: ''
- slide: 11
  shape: 2
  run: 0
  kind: title
  zh: 为什么要修感恩心（利益思维）
  en: ''
- slide: 11
  shape: 3
  run: 0
  kind: body
  zh: 佛法认为，感恩心能给我们带来这些利益：
  en: ''
- slide: 11
  shape: 3
  run: 1
  kind: body
  zh: 感恩是福报的源泉
  en: ''
- slide: 11
  shape: 3
  run: 2
  kind: body
  zh: 使人内心调柔、欢喜
  en: ''
- slide: 11
  shape: 3
  run: 3
  kind: body
  zh: 产生亲和力，让众生欢喜，被众生接纳，与众生建立善缘
  en: ''
- slide: 11
  shape: 3
  run: 4
  kind: body
  zh: 有助于社会和谐
  en: ''
- slide: 11
  shape: 3
  run: 5
  kind: body
  zh: 是爱心和慈悲心的基础
  en: ''
- slide: 11
  shape: 4
  run: 0
  kind: body
  zh: 交流分享 (15分钟)
  en: ''
- slide: 11
  shape: 4
  run: 2
  kind: body
  zh: 结合现实人生，对感恩的每一条利益，分享自己观察到的现实案例。
  en: ''
- slide: 11
  shape: 4
  run: 3
  kind: body
  zh: 我需要修感恩心吗？为什么？
  en: ''
- slide: 12
  shape: 0
  run: 0
  kind: title
  zh: 带着感恩心看待众生
  en: ''
- slide: 12
  shape: 2
  run: 0
  kind: body
  zh: 如果没有感恩心，看别人往往没感觉，甚至会心生对立，觉得世上都是敌人，都在算计你。当你带着这样的心态看人，看到谁都不欢喜，别人看到你也不欢喜。
  en: ''
- slide: 12
  shape: 2
  run: 1
  kind: body
  zh: 如果我们认识到，自己每天在享受他人的给予，不仅是父母、亲戚、朋友的帮助关爱，还有社会各行各业的人提供服务，乃至飞鸟鱼虫，都在为地球共建生态环境，就能带着感恩心看待众生，看到一切都心生欢喜。当我们以这样的心看待众生，就会产生亲和力，让众生欢喜，被众生接纳。这种和乐就是幸福的助缘。
  en: ''
- slide: 13
  shape: 0
  run: 0
  kind: body
  zh: 修习感恩——
  en: ''
