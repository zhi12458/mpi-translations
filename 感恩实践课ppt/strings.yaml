  kind: body
  zh: 交流分享 (10分钟)
  en: ''
- slide: 17
  shape: 0
  run: 0
  kind: title
  zh: 感恩需要刻意修习
  en: ''
- slide: 17
  shape: 2
  run: 0
  kind: body
  zh: 如果我们没有留心关注自己拥有的一切,就会不自觉地被负面的事物所吸引。
  en: ''
- slide: 17
  shape: 2
  run: 1
  kind: body
  zh: 当我们将焦点放在负面事物上,它们就会不断涌现;更重要的是,过于关注负面事物会屏蔽幸福。
  en: ''
- slide: 17
  shape: 2
  run: 2
  kind: body
  zh: 让自己尽可能多地心存感恩,将给自己带来最美好的“生命体验”和最“富足”的人生。
  en: ''
- slide: 18
  shape: 0
  run: 0
  kind: title
  zh: 2. 因缘之网
  en: ''
- slide: 18
  shape: 2
  run: 0
  kind: body
  zh: 每一份美好都是缘起而非独立存在的，由无数众生与因缘条件共同成就。
  en: ''
- slide: 19
  shape: 1
  run: 0
  kind: body
  zh: 我们不是孤立地生活在这个世界，需要父母养育，需要老师教导，长大成人后，依然离不开社会大众的给予。否则，我们就要自己种田，自己织布，自己制造生活所需。仅仅是每天的衣食住行，我们就得到了众生多少帮助，多少付出啊。所以说，每个众生都是对我们有恩的人，是需要我们用感恩心回报的。
  en: ''
- slide: 19
  shape: 1
  run: 1
  kind: body
  zh: 现代人比较注重“自我”的感受，而从佛法来看，这个“自我”无非是一场彻头彻尾的超级骗局。在这种感受的误导下，人们很容易将自己和世界对立起来，甚至将每个人视为潜在的敌人，导致孤独、自闭乃至抑郁等心理疾病。如果换个角度，想着每个人都有恩于你，整个世界都在为你服务，那么，看到任何人都不会觉得陌生。
  en: ''
- slide: 19
  shape: 4
  run: 0
  kind: body
  zh: 生活中，我通常会把身边哪些人的付出当作是理所当然的，很少对他们生起感恩之心？
  en: ''
- slide: 19
  shape: 4
  run: 1
  kind: body
  zh: 生活中，有哪些人我觉得是毫无关系的陌生人？我是以怎样的心态和表现面对这些“陌生人”的？
  en: ''
- slide: 19
  shape: 5
  run: 0
  kind: body
  zh: 交流分享 (10分钟)
  en: ''
- slide: 19
  shape: 6
  run: 0
  kind: body
  zh: 每个人都有恩于你，整个世界都在为你服务
  en: ''
- slide: 20
  shape: 2
  run: 0
  kind: title
  zh: 现场练习：因缘之网 (10分钟)
  en: ''
- slide: 20
  shape: 3
  run: 0
  kind: body
  zh: 现代社会“原子化”的生活，常常让人们产生一种孤立的错觉。事实上，所有的生命都紧密相连、相互依存。
  en: ''
- slide: 20
  shape: 3
  run: 1
  kind: body
  zh: 请选择一个自己感恩的事物，写在纸的中心。
  en: ''
- slide: 20
  shape: 3
  run: 2
  kind: body
  zh: 把成就这个事物的因缘（人、事、物）逐个列出来，用线条连接，方框表示事、物，圆圈表示人。
  en: ''
- slide: 20
  shape: 3
  run: 3
  kind: body
  zh: 每个人或事又是缘起而非独存的，再把成就他们的因缘依次列出来，形成“因缘之网”。
  en: ''
- slide: 20
  shape: -1
  run: 0
  kind: notes
  zh: 熟悉这种练习之后，任何一个对象，不论是食品、物品、乃至一个人、一件事，都可以用缘起的思维深入观察。
  en: ''
- slide: 21
  shape: 0
  run: 0
  kind: title
  zh: 互动练习 (10分钟)
  en: ''
- slide: 21
  shape: 3
  run: 0
  kind: body
  zh: 2人一组，交换各自的“因缘之网”练习，互相补充：还有哪些我能想到的因缘？(5分钟)
  en: ''
- slide: 21
  shape: 3
  run: 1
  kind: body
  zh: 2人互相分享自己补充的内容和心得(5分钟)
  en: ''
- slide: 22
  shape: 0
  run: 0
  kind: title
  zh: 交流分享 (10分钟)
  en: ''
- slide: 22
  shape: 3
  run: 0
  kind: body
  zh: 在刚刚的练习中，我有什么想法和感受？
  en: ''
- slide: 22
  shape: 3
  run: 1
  kind: body
  zh: 分享其中一个给自己带来触动的因缘链条
  en: ''
- slide: 22
  shape: 3
  run: 2
  kind: body
  zh: 有哪些因缘，是我从未想过要感恩的？
  en: ''
- slide: 23
  shape: 0
  run: 0
  kind: title
  zh: 看到并感恩自己拥有的一切
  en: ''
- slide: 23
  shape: 2
  run: 0
  kind: body
  zh: 生活在世间，我们既是独立的个体，也是世界的一部分，离不开万物的滋养，众生的护佑。我们今天在这里，同样有众多因缘的成就，所以要对这一切心生感恩。佛法说的“上报四重恩”，就是感念父母、师长、国家、众生的恩德，发愿报答。当我们生起感恩，内心是欢喜且柔软的，会主动想着为社会、为众生做些什么。这是增长慈悲心的基础。
  en: ''
